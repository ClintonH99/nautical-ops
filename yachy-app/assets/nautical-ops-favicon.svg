<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">

  <!-- Hull — rounded wide bottom, outline only -->
  <path d="M15 75 Q15 85 50 87 Q85 85 85 75 L79 55 L21 55 Z" 
        fill="none" stroke="#D4A017" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cabin/superstructure — sits on top of hull -->
  <rect x="28" y="40" width="44" height="17" rx="3" 
        fill="none" stroke="#D4A017" stroke-width="2.5"/>

  <!-- Cabin windows — 3 small squares -->
  <rect x="33" y="44" width="7" height="6" rx="1" 
        fill="none" stroke="#D4A017" stroke-width="1.5"/>
  <rect x="46" y="44" width="7" height="6" rx="1" 
        fill="none" stroke="#D4A017" stroke-width="1.5"/>
  <rect x="59" y="44" width="7" height="6" rx="1" 
        fill="none" stroke="#D4A017" stroke-width="1.5"/>

  <!-- Mast — vertical pole -->
  <line x1="50" y1="18" x2="50" y2="40" 
        stroke="#D4A017" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mast top circle -->
  <circle cx="50" cy="15" r="4" 
          fill="none" stroke="#D4A017" stroke-width="2"/>

  <!-- Boom arm extending right -->
  <line x1="50" y1="30" x2="70" y2="37" 
        stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>

  <!-- Water wave 1 -->
  <path d="M10 90 Q18 85 26 90 Q34 95 42 90 Q50 85 58 90 Q66 95 74 90 Q82 85 90 90" 
        fill="none" stroke="#D4A017" stroke-width="2" stroke-linecap="round"/>

</svg>
