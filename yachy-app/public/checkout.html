<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Secure Checkout — Nautical Ops</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        color: #17223b;
        background: #f6f7f9;
      }
      body {
        margin: 0;
        padding: 32px 20px;
      }
      main {
        max-width: 540px;
        margin: 10vh auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #e1e5eb;
        border-radius: 20px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }
      img {
        width: 42px;
        height: 42px;
      }
      h1 {
        font-size: 26px;
        margin-top: 28px;
      }
      p {
        line-height: 1.6;
      }
      a {
        color: #233f89;
        font-weight: 600;
        display: inline-block;
        padding: 12px 0;
      }
      #environment {
        font-weight: 600;
        color: #785000;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #101827;
          color: #fff;
        }
        main {
          background: #192439;
          border-color: #354159;
        }
        a {
          color: #cbd8ff;
        }
        #environment {
          color: #fbd890;
        }
      }
    </style>
    <script src="/paddle-checkout-config.js" defer></script>
    <script src="/paddle-checkout.js" defer></script>
  </head>
  <body>
    <main>
      <header><img src="/favicon-vessel.png" alt="" />Nautical Ops</header>
      <p id="environment" hidden>Sandbox test — no real payment</p>
      <h1>Secure checkout</h1>
      <p id="status" role="status" aria-live="polite">Preparing your secure checkout…</p>
      <p>Your vessel plan is activated only after the server verifies your subscription.</p>
      <a href="/vessel-plans">Return to Vessel Plans</a>
    </main>
  </body>
</html>
