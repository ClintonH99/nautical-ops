# Sends day-before trip reminders daily at 8:00 UTC.
# Required repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.

name: Trip reminders

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger day-before reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "${SUPABASE_URL}/functions/v1/send-trip-push" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            --data '{"type":"reminders"}'
