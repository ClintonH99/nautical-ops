name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: yachy-app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: yachy-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Web server dependency and security checks
        working-directory: .
        run: npm ci && npm test && npm audit --audit-level=high

      - name: Lint (QC Gate 1)
        run: npm run lint

      - name: TypeScript check (QC Gate 2)
        run: npm run typecheck

      - name: Run tests (QC Gate 2b)
        run: npm run test

      - name: Database transaction and permission regressions (disposable PostgreSQL)
        run: |
          npm install --prefix "$RUNNER_TEMP/nautical-db-tests" --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.8
          export PGLITE_MODULE_PATH="$RUNNER_TEMP/nautical-db-tests/node_modules/@electric-sql/pglite"
          node supabase/tests/run_watch_publication_test.cjs
          node supabase/tests/run_vessel_departure_test.cjs
          node supabase/tests/run_paddle_billing_test.cjs

      - name: Expo dependency check (QC Gate 3)
        run: npx expo install --check

      - name: Web production build validation (QC Gate 4)
        run: npm run web:build

      - name: Dependency audit (QC Gate 5)
        run: npm audit --audit-level=high
